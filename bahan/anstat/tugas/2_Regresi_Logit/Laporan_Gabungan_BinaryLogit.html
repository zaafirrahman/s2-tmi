<title>Laporan Model Binary Logit — Novotel vs Pullman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1A2B2E;
    --paper:#F4F1E8;
    --paper-dim:#EAE4D3;
    --teal:#2E5C5A;
    --teal-deep:#1D3E3D;
    --gold:#B8863A;
    --gold-soft:#EADFC7;
    --line:#DCD3BF;
    --card:#FFFFFE;
    --shadow: 0 18px 40px -20px rgba(29,62,61,0.45);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Sans 3', sans-serif;
    display:flex;
    flex-direction:column;
  }

  /* ===== Top masthead ===== */
  .masthead{
    background:linear-gradient(160deg, var(--teal-deep) 0%, var(--teal) 100%);
    color:#fff;
    padding:36px 28px 28px;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .masthead::after{
    content:"";
    position:absolute; right:-100px; top:-140px;
    width:320px; height:320px; border-radius:50%;
    background:radial-gradient(circle, rgba(184,134,58,0.30), transparent 70%);
  }
  .masthead-inner{max-width:1100px; margin:0 auto; position:relative;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.05em;
    color:var(--gold-soft);
    margin:0 0 10px;
    text-transform:uppercase;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    line-height:1.2;
    margin:0 0 6px;
  }
  .masthead p.sub{
    margin:0;
    font-size:15px;
    color:#CFE0DB;
    max-width:640px;
  }

  /* ===== Tab bar ===== */
  .tabbar-wrap{
    background:var(--card);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:20;
    flex-shrink:0;
    box-shadow:var(--shadow);
  }
  .tabbar{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    gap:2px;
    padding:0 20px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    all:unset;
    cursor:pointer;
    padding:16px 20px 14px;
    display:flex;
    flex-direction:column;
    gap:3px;
    white-space:nowrap;
    border-bottom:3px solid transparent;
    transition:border-color .15s ease, background .15s ease;
    min-width:150px;
  }
  .tab:hover{background:var(--paper-dim);}
  .tab .tnum{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--gold);
    letter-spacing:.04em;
  }
  .tab .tlabel{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16.5px;
    color:var(--ink);
  }
  .tab .tsub{
    font-size:12px;
    color:#7A7264;
  }
  .tab.active{
    border-bottom-color:var(--gold);
    background:var(--paper-dim);
  }
  .tab.active .tlabel{color:var(--teal-deep);}

  /* ===== Content area ===== */
  .content{
    flex:1;
    position:relative;
    min-height:0;
  }
  .pane{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
  }
  .pane.active{display:flex;}
  .pane iframe{
    flex:1;
    width:100%;
    border:0;
    background:var(--paper);
  }
  .loading{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:#7A7264;
    letter-spacing:.03em;
    background:var(--paper);
  }

  footer.site{
    text-align:center;
    padding:12px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:#7A7264;
    background:var(--card);
    border-top:1px solid var(--line);
    flex-shrink:0;
  }

  @media (max-width:640px){
    h1{font-size:23px;}
    .masthead{padding:26px 20px 20px;}
    .tab{min-width:120px; padding:13px 14px 11px;}
    .tab .tlabel{font-size:14.5px;}
  }
</style>
</head>

const tabbar = document.getElementById('tabbar');
const content = document.getElementById('content');

TABS.forEach((t, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (i === 0 ? ' active' : '');
  btn.id = 'tabbtn-' + i;
  btn.innerHTML = `<span class="tnum">${t.num}</span><span class="tlabel">${t.label}</span><span class="tsub">${t.sub}</span>`;
  btn.addEventListener('click', () => activate(i));
  tabbar.appendChild(btn);

  const pane = document.createElement('div');
  pane.className = 'pane' + (i === 0 ? ' active' : '');
  pane.id = 'pane-' + i;
  pane.innerHTML = `<div class="loading" id="loading-${i}">Memuat laporan…</div>`;
  content.appendChild(pane);
});

const loaded = new Set();

function loadPane(i) {
  if (loaded.has(i)) return;
  loaded.add(i);
  const pane = document.getElementById('pane-' + i);
  const iframe = document.createElement('iframe');
  iframe.src = 'data:text/html;base64,' + TABS[i].b64;
  iframe.title = TABS[i].label;
  iframe.addEventListener('load', () => {
    const l = document.getElementById('loading-' + i);
    if (l) l.remove();
  });
  pane.appendChild(iframe);
}

function activate(i) {
  TABS.forEach((_, j) => {
    document.getElementById('tabbtn-' + j).classList.toggle('active', j === i);
    document.getElementById('pane-' + j).classList.toggle('active', j === i);
  });
  loadPane(i);
}

// load first tab immediately
loadPane(0);
</script>
