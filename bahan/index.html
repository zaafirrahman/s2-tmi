<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materi & Tugas | Repo S2</title>
<link rel="icon" type="image/png" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0C0C0A;--card:#121210;--fg:#F2F2EE;--mut:#A9A9A0;--line:rgba(255,255,255,.6);--bd:rgba(255,255,255,.2);--code:#171715;--acc:#FFC400;--ink:#0C0C0A;--grid:rgba(255,255,255,.05);--gridM:rgba(255,255,255,.12);
--k:#FF7B72;--s:#A5D6FF;--n:#79C0FF;--c:#8B949E;--f:#FFC400;
--disp:"Barlow Condensed","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:linear-gradient(var(--gridM) 1px,transparent 1px),linear-gradient(90deg,var(--gridM) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;color:var(--fg);font:400 15px/1.6 var(--body);display:grid;grid-template-columns:290px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;gap:10px;align-items:center;min-height:54px;padding:8px 14px;background:var(--card);border-bottom:1.5px solid var(--line)}
header b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 22px/1 var(--disp);letter-spacing:.01em}
.lg{height:30px;width:auto}
button,a.b{font:500 13px var(--body);padding:6px 12px;border:1.5px solid var(--acc);background:transparent;color:var(--acc);border-radius:3px;cursor:pointer;text-decoration:none;transition:.12s}
button:hover,a.b:hover{background:var(--acc);color:var(--ink)}
button:focus-visible,a.b:focus-visible,aside input:focus-visible,.f:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
#menu{display:none}
.ib{display:inline-flex;align-items:center;justify-content:center;padding:6px 9px}.ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
aside{background:var(--card);border-right:1.5px solid var(--line);overflow:auto;padding:10px;min-height:0}
aside input{width:100%;padding:8px 10px;border:1.5px solid var(--bd);border-radius:3px;background:var(--bg);color:var(--fg);font:inherit;margin-bottom:10px}
aside input:focus{border-color:var(--acc)}
details{margin-left:10px}summary{cursor:pointer;padding:3px 0;font:600 17px/1.3 var(--disp);letter-spacing:.01em}
.f{display:flex;align-items:center;gap:7px;padding:4px 8px;margin-left:10px;border-radius:3px;color:var(--fg);text-decoration:none;font-size:13.5px}
.f span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{flex:none;width:26px;height:16px;border-radius:3px;font:700 9px/16px var(--body);font-style:normal;text-align:center;letter-spacing:.02em;color:#fff;background:#6B6B64}
.ic.pdf{background:#E5473B}.ic.docx{background:#2B6CD4}.ic.xlsx{background:#1E8E4E}.ic.csv{background:#1B9A8C}.ic.ipynb{background:#F37726}.ic.py{background:#3776AB}.ic.html{background:#D8481F}
.f:hover{background:var(--code)}.f.on{background:var(--acc);color:var(--ink);font-weight:500}
main{overflow:auto;min-height:0;min-width:0}
#v{margin:20px auto;max-width:980px;padding:22px;background:var(--bg);border:1.5px solid var(--bd)}
#v.full{max-width:none;margin:0;padding:0;border:0;height:100%;background:#fff}
iframe{width:100%;height:100%;border:0;background:#fff}
.msg{color:var(--mut);padding:30px 0;text-align:center}.mb{display:none;font-size:15px;padding:10px 18px;margin-top:6px}.msg a{color:var(--acc)}
pre{margin:0;background:var(--code);border:1px solid var(--bd);border-radius:3px;padding:10px 12px;overflow-x:auto;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.md h1,.md h2,.md h3{font-family:var(--disp);font-weight:700;line-height:1.1;margin:1.1em 0 .4em}
.md h1{font-size:44px}.md h2{font-size:32px}.md h3{font-size:24px}
.md a{color:var(--acc)}.md blockquote{border-left:3px solid var(--acc);margin-left:0;padding-left:14px;color:var(--mut)}
.md table,.out table,.t{border-collapse:collapse;font-size:13px}
.md table,.tw{display:block;overflow-x:auto;max-width:100%}
.md th,.md td,.out th,.out td,.t th,.t td{border:1px solid var(--bd);padding:4px 10px}
.md th,.out th,.t th{background:var(--code);color:var(--acc);font-weight:500}
.md th,.t th{text-align:left}
.md code{background:var(--code);padding:1px 5px;border-radius:3px}.md pre code{padding:0;background:none}
.md img,.out img,#v>img{max-width:100%;height:auto}
.out{margin:6px 0 16px;border-left:3px solid var(--acc);padding:6px 12px;overflow-x:auto}
.out pre{background:none;border:0;padding:0;white-space:pre-wrap;word-break:break-word}
.out.err{border-color:#FF6B5B}.out img{background:#fff}
.tab{display:inline-block;margin:0 6px 8px 0}.tab.on{background:var(--acc);color:var(--ink)}
canvas{display:block;max-width:100%;height:auto;margin:0 auto 12px;outline:1px solid var(--bd)}
.hljs-keyword,.hljs-literal,.hljs-built_in{color:var(--k)}.hljs-string,.hljs-regexp{color:var(--s)}
.hljs-number,.hljs-attr{color:var(--n)}.hljs-comment{color:var(--c);font-style:italic}.hljs-title{color:var(--f)}
@media(max-width:800px){body{grid-template-columns:1fr}header{grid-column:1}#menu{display:inline-block}.mb{display:inline-block}.dk{display:none}.lg{height:24px}
aside{position:fixed;inset:54px 0 0 0;z-index:9;transform:translateX(-100%);transition:.2s;border:0}body.open aside{transform:none}
#v{margin:0;border-width:0;padding:16px}}
</style>
</head>
<body>
<header><button id="menu">☰</button><a class="b" href="../index.html">Hub</a><img class="lg" src="../logo.png" alt="" onerror="this.remove()"><b id="ttl">Materi & Tugas</b><button id="cp" class="ib" title="Salin link" aria-label="Salin link"></button><a class="b ib" id="raw" target="_blank" rel="noopener" title="Download" aria-label="Download"></a></header>
<aside><input id="q" placeholder="Cari file…" type="search"><div id="tree"></div></aside>
<main><div id="v"><div class="msg"><p>Pilih file dari daftar<span class="dk"> di samping</span>.</p><button id="ob" class="mb">☰ Buka daftar file</button></div></div></main>
<script>
const $=s=>document.querySelector(s),V=$('#v'),C='https://cdnjs.cloudflare.com/ajax/libs/';
const LIBS={md:[C+'marked/12.0.2/marked.min.js',C+'dompurify/3.1.6/purify.min.js'],hl:[C+'highlight.js/11.9.0/highlight.min.js'],
csv:[C+'PapaParse/5.4.1/papaparse.min.js'],xls:[C+'xlsx/0.18.5/xlsx.full.min.js'],doc:[C+'mammoth/1.6.0/mammoth.browser.min.js',C+'dompurify/3.1.6/purify.min.js'],pdf:[C+'pdf.js/3.11.174/pdf.min.js']};
const L={},lib=u=>L[u]??=new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=j;document.head.appendChild(s)});
const need=(...k)=>Promise.all(k.flatMap(x=>LIBS[x]).map(lib));
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ansi=s=>s.replace(/\u001b\[[0-9;]*[A-Za-z]/g,''),join=x=>Array.isArray(x)?x.join(''):x||'';
const clean=h=>DOMPurify.sanitize(h,{FORBID_TAGS:['style','script','iframe'],FORBID_ATTR:['style']});
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const hl=(s,l)=>{try{return hljs.highlight(s,{language:l,ignoreIllegals:true}).value}catch(e){return esc(s)}};
const get=async(p,t)=>{const r=await fetch(enc(p));if(!r.ok)throw Error(r.status);return t?r.text():r.arrayBuffer()};
const LANG={py:'python',js:'javascript',json:'json',css:'css',sql:'sql',r:'r',sh:'bash',yml:'yaml',yaml:'yaml',xml:'xml',txt:'plaintext',log:'plaintext',ini:'ini',toml:'ini',cfg:'ini',java:'java',c:'c',cpp:'cpp',ts:'typescript',m:'matlab'};
const tbl=rows=>{const t=document.createElement('table');t.className='t';rows.slice(0,500).forEach((r,i)=>{const tr=t.insertRow();r.forEach(c=>{const d=document.createElement(i?'td':'th');d.textContent=c??'';tr.appendChild(d)})});
 const w=document.createElement('div');w.className='tw';w.appendChild(t);if(rows.length>500)w.insertAdjacentHTML('beforeend','<p class="msg">Menampilkan 500 dari '+rows.length+' baris.</p>');return w};

function nbOut(o){const d=document.createElement('div');d.className='out';const m=o.data||{};
 if(o.output_type==='stream')d.innerHTML='<pre>'+esc(ansi(join(o.text)))+'</pre>';
 else if(o.output_type==='error'){d.classList.add('err');d.innerHTML='<pre>'+esc(ansi((o.traceback||[]).join('\n')))+'</pre>'}
 else if(m['image/png'])d.innerHTML='<img src="data:image/png;base64,'+join(m['image/png']).replace(/\s/g,'')+'">';
 else if(m['image/jpeg'])d.innerHTML='<img src="data:image/jpeg;base64,'+join(m['image/jpeg']).replace(/\s/g,'')+'">';
 else if(m['text/html'])d.innerHTML=clean(join(m['text/html']));
 else if(m['text/plain'])d.innerHTML='<pre>'+esc(ansi(join(m['text/plain'])))+'</pre>';
 else return null;return d}

const R={
 async ipynb(p){await need('md','hl');const nb=JSON.parse(await get(p,1)),lang=nb.metadata?.language_info?.name||'python',f=document.createDocumentFragment();
  for(const c of nb.cells){const e=document.createElement('div');
   if(c.cell_type==='markdown')e.className='md',e.innerHTML=clean(marked.parse(join(c.source)));
   else{e.innerHTML='<pre><code></code></pre>';e.querySelector('code').innerHTML=hl(join(c.source),lang);(c.outputs||[]).map(nbOut).filter(Boolean).forEach(o=>e.appendChild(o))}
   f.appendChild(e)}V.innerHTML='';V.appendChild(f)},
 async md(p){await need('md');V.innerHTML='<div class="md">'+clean(marked.parse(await get(p,1)))+'</div>'},
 async code(p,ext){await need('hl');V.innerHTML='<pre><code></code></pre>';V.querySelector('code').innerHTML=hl(await get(p,1),LANG[ext]||'plaintext')},
 async csv(p){await need('csv');V.innerHTML='';V.appendChild(tbl(Papa.parse(await get(p,1),{skipEmptyLines:true}).data))},
 async xls(p){await need('xls');const wb=XLSX.read(await get(p));V.innerHTML='';const box=document.createElement('div');
  wb.SheetNames.forEach((n,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=n;b.onclick=()=>{[...V.querySelectorAll('.tab')].forEach(x=>x.classList.toggle('on',x===b));box.innerHTML='';box.appendChild(tbl(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''})))};V.appendChild(b);if(!i)b.click()});V.appendChild(box)},
 async docx(p){await need('doc');const r=await mammoth.convertToHtml({arrayBuffer:await get(p)});V.innerHTML='<div class="md">'+clean(r.value)+'</div>'},
 async pdf(p){await need('pdf');pdfjsLib.GlobalWorkerOptions.workerSrc=C+'pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await get(p)}).promise;V.innerHTML='';const w=Math.min(V.clientWidth||800,980),dpr=Math.min(devicePixelRatio||1,2),tok=p;
  for(let i=1;i<=pdf.numPages;i++){if(cur!==tok)return;const pg=await pdf.getPage(i),b=pg.getViewport({scale:1}),vp=pg.getViewport({scale:w/b.width*dpr}),cv=document.createElement('canvas');
   cv.width=vp.width;cv.height=vp.height;V.appendChild(cv);await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise}},
 html(p){V.className='full';V.innerHTML='<iframe sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals" src="'+enc(p)+'"></iframe>'},
 img(p){V.innerHTML='<img src="'+enc(p)+'">'},
 other(p){V.innerHTML='<p class="msg">Preview belum tersedia untuk tipe ini.<br><a href="'+enc(p)+'" download>Download file</a></p>'}
};
const MAP={ipynb:'ipynb',md:'md',csv:'csv',tsv:'csv',xlsx:'xls',xls:'xls',docx:'docx',pdf:'pdf',html:'html',htm:'html',png:'img',jpg:'img',jpeg:'img',gif:'img',webp:'img',svg:'img'};
let cur='';
async function open(p){cur=p;V.className='';V.innerHTML='<p class="msg">Memuat…</p>';document.body.classList.remove('open');
 $('#raw').href=enc(p);document.querySelectorAll('.f').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
 const ext=p.split('.').pop().toLowerCase(),k=MAP[ext]||(LANG[ext]?'code':'other');
 try{await R[k](p,ext)}catch(e){if(cur===p)V.innerHTML='<p class="msg">Gagal memuat: '+esc(String(e.message||e))+'</p>'}}
const route=()=>{const p=decodeURIComponent(location.hash.slice(2));if(p)open(p)};
addEventListener('hashchange',route);
$('#ob').onclick=()=>document.body.classList.add('open');
$('#menu').onclick=()=>document.body.classList.toggle('open');
const ICO={cp:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',ok:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',dl:'<svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>'};
$('#cp').innerHTML=ICO.cp;$('#raw').innerHTML=ICO.dl;
$('#cp').onclick=async()=>{const b=$('#cp');try{await navigator.clipboard.writeText(location.href);b.innerHTML=ICO.ok}catch(e){prompt('Salin link:',location.href)}setTimeout(()=>b.innerHTML=ICO.cp,1500)};

let files=[];
const ICT={pdf:'PDF',docx:'DOC',doc:'DOC',xlsx:'XLS',xls:'XLS',csv:'CSV',tsv:'CSV',ipynb:'NB',py:'PY',html:'HTM',htm:'HTM'};
const ICC={doc:'docx',xls:'xlsx',tsv:'csv',htm:'html'};
const link=(f,full)=>{const a=document.createElement('a');a.className='f';a.dataset.p=f.p;a.href='#/'+enc(f.p);a.title=f.p;
 const e=f.p.split('.').pop().toLowerCase(),i=document.createElement('i'),s=document.createElement('span');
 i.className='ic '+(ICC[e]||e);i.textContent=ICT[e]||e.slice(0,3).toUpperCase();s.textContent=full?f.p:f.p.split('/').pop();a.append(i,s);return a};
function build(q){const T=$('#tree');T.innerHTML='';
 if(q){files.filter(f=>f.p.toLowerCase().includes(q)).forEach(f=>{T.appendChild(link(f,1))});return}
 const root={};files.forEach(f=>{let n=root;f.p.split('/').slice(0,-1).forEach(d=>n=n[d]??={});(n.__f??=[]).push(f)});
 const draw=(n,box,top)=>{Object.keys(n).filter(k=>k!=='__f').sort().forEach(k=>{const d=document.createElement('details');d.open=top;d.innerHTML='<summary>'+esc(k)+'</summary>';draw(n[k],d,false);box.appendChild(d)});(n.__f||[]).forEach(f=>box.appendChild(link(f)))};
 draw(root,T,true);const cp=decodeURIComponent(location.hash.slice(2));
 if(cp)T.querySelectorAll('.f').forEach(a=>{if(a.dataset.p===cp){a.classList.add('on');for(let e=a.parentElement;e&&e!==T;e=e.parentElement)if(e.tagName==='DETAILS')e.open=true}})}
$('#q').oninput=e=>build(e.target.value.trim().toLowerCase());
fetch('manifest.json',{cache:'no-cache'}).then(r=>r.json()).then(m=>{files=m.files;build('');route()}).catch(()=>{$('#tree').innerHTML='<p class="msg">manifest.json tidak ditemukan.<br>Jalankan <code>python scripts/gen_manifest.py</code> atau push dulu.</p>'});
</script>
</body>
</html>
