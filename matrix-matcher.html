<!doctype html>
<html lang="id" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Matrix Matcher — Stack Teknis TMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{--bg:#FBFBF8;--card:#fff;--ink:#111;--mut:#4B4B4B;--line:#111;--soft:#D8D8D0;--sh:#111;--shc:#FF4B3E;--code:#F1F1EA;--y:#FFE14D;--teal:#12A594;--tint:#CDEFE9;--grid:rgba(18,165,148,.16);
--disp:'Bricolage Grotesque',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#121413;--card:#1B1E1D;--ink:#F4F4EF;--mut:#C2C2BA;--line:#F4F4EF;--soft:#3A3F3D;--sh:#F4F4EF;--shc:#FF4B3E;--code:#252928;--tint:#0F4A42;--grid:rgba(18,165,148,.14);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
h1,h2,h3{font-family:var(--disp);font-weight:800;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer;border-radius:0}
header{padding:calc(28px + env(safe-area-inset-top,0px)) 0 8px}
.hin{max-width:1180px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;column-gap:16px;align-items:start}
.hin h1{grid-column:1;grid-row:1}.hin .tgrow{grid-column:2;grid-row:1/3;padding-top:6px}.hin p{grid-column:1;grid-row:2}
.tgrow{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.back{display:inline-block;white-space:nowrap;background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:4px 4px 0 var(--sh);padding:6px 12px;font:800 15px/1.2 var(--disp);text-decoration:none;transition:transform .12s,box-shadow .12s}
.back:hover{background:var(--y);color:#111;transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.back:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--sh)}
.seg{display:flex;border:3px solid var(--line);background:var(--card);box-shadow:4px 4px 0 var(--sh)}
.seg button{width:40px;height:36px;background:transparent;color:var(--ink);border:0;padding:0;display:grid;place-items:center}
.seg button+button{border-left:3px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--y);color:#111}
header h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.01em;overflow-wrap:anywhere}
header p{margin:12px 0 0;font-size:17px;max-width:64ch;color:var(--mut)}
.wrap{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:24px clamp(16px,4vw,48px) 56px;align-items:start}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
@media(max-width:480px){header h1{font-size:32px}.seg button{width:36px;height:34px}}
.side,.main{background:var(--card);border:3px solid var(--line)}
.side{box-shadow:6px 6px 0 var(--shc);padding:18px;position:sticky;top:16px}
@media(max-width:860px){.side{position:static}}
.main{box-shadow:6px 6px 0 var(--sh);padding:24px clamp(16px,3vw,28px)}
input[type=search],textarea{width:100%;padding:10px 12px;border:3px solid var(--line);border-radius:0;background:var(--card);color:var(--ink);font:inherit}
textarea{min-height:96px;resize:vertical;margin:4px 0 12px}
:focus-visible{outline:3px solid var(--shc);outline-offset:3px}
.lbl{font:800 15px/1.2 var(--disp);margin:22px 0 10px}
.main .lbl{font-size:18px;margin-top:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);padding:4px 10px;font-size:13.5px;font-weight:600;line-height:1.3;transition:transform .12s,box-shadow .12s}
.chip.co{background:var(--oc);color:#111}
.chip:hover{box-shadow:3px 3px 0 var(--sh);transform:translate(-2px,-2px)}
.chip[aria-pressed=true]{background:var(--y);color:#111;box-shadow:3px 3px 0 var(--sh)}
.chip.co[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.list{margin-top:18px;display:flex;flex-direction:column;gap:10px;max-height:42vh;overflow-y:auto;overflow-x:hidden;padding:4px 8px 8px 4px}
.item{display:flex;align-items:center;gap:10px;padding:9px 10px;cursor:pointer;border:2px solid var(--line);background:var(--card);position:relative;padding-left:24px;transition:transform .12s,box-shadow .12s}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--oc);border-right:2px solid var(--line)}
.item:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--sh)}
.item.on{background:var(--oc);color:#111;box-shadow:4px 4px 0 var(--sh)}
.item b{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;font-size:14.5px;line-height:1.3}
.item small{display:block;font-weight:400;font-size:12.5px;opacity:.8;margin-top:2px}
.item input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.n{font:500 12.5px var(--mono);background:var(--card);color:var(--ink);border:2px solid var(--line);padding:1px 8px;white-space:nowrap;display:inline-block}
.item.on .n{background:#fff;color:#111;border-color:#111}
.btn{background:var(--card);color:var(--ink);border:3px solid var(--line);padding:9px 16px;font:800 15px/1.1 var(--disp);box-shadow:4px 4px 0 var(--sh);transition:transform .12s,box-shadow .12s}
.btn:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--sh)}
.btn.g{background:var(--y);color:#111}
.btn:not(.g){background:var(--shc);color:#111}
.btn:disabled{background:var(--code);color:var(--mut);border-color:var(--soft);box-shadow:none;cursor:not-allowed}
.row{display:flex;gap:12px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.row>span:last-child:not(.n):not(.cat){display:flex;gap:12px}
.main h2{font-size:clamp(24px,3.4vw,34px);display:inline-block;max-width:100%;overflow-wrap:anywhere;background:var(--oc,var(--y));color:#111;padding:6px 12px;border:3px solid var(--line);box-shadow:5px 5px 0 var(--sh)}
.cmphead{margin:20px 0 20px}
.cat{margin:18px 0 0;font:500 13.5px/1.4 var(--mono);color:var(--mut)}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 26px;padding-bottom:20px;border-bottom:3px dashed var(--line)}
.tab{background:var(--card);color:var(--ink);border:2px solid var(--line);padding:7px 14px;font-weight:600;font-size:14.5px;transition:transform .12s,box-shadow .12s}
.tab:hover{box-shadow:3px 3px 0 var(--sh);transform:translate(-2px,-2px)}
.tab[aria-selected=true]{background:var(--oc,var(--y));color:#111;box-shadow:4px 4px 0 var(--sh);font-weight:700}
.box{background:var(--oc,var(--y));color:#111;border:3px solid var(--line);padding:14px 16px;max-width:72ch;box-shadow:4px 4px 0 var(--sh)}
.nov{background:var(--card);color:var(--ink);border-style:dashed;box-shadow:none}
.tw{overflow-x:auto;border:3px solid var(--line);background:var(--card);margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:12px 14px;border:1px solid var(--soft)}
th{font-weight:700;background:var(--code);min-width:130px}
table.rh th{border-right:3px solid var(--line)}
table.hr tr:first-child>*{border-bottom:3px solid var(--line)}
table.hr th:first-child{border-right:3px solid var(--line)}
td{min-width:170px;overflow-wrap:anywhere}
tr:nth-child(even) td{background:color-mix(in srgb,var(--code) 45%,transparent)}
p,li,.box,.cat{overflow-wrap:anywhere}
.main p{max-width:72ch;margin:12px 0}
h3{font-size:19px;margin:26px 0 10px}
ul{padding-left:22px;margin:10px 0}li{margin:6px 0}
pre{background:#111;color:#F4F4EF;padding:16px;border:3px solid var(--line);overflow:auto;font:13px/1.6 var(--mono);margin:10px 0 16px}
a{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:600}
a:hover{background:var(--y);color:#111}
.yr{font-family:var(--mono);font-size:13px;color:var(--mut)}
td.yr{white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--y);color:#111;border:3px solid var(--line);box-shadow:5px 5px 0 var(--sh);font-weight:700;padding:8px 16px;z-index:9}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.chip:hover,.item:hover,.tab:hover,.back:hover,.btn:hover:not(:disabled){transform:none}}

l/view_data/rancangan-sistem-distribusi-gula-pasir-untuk-pabrik-gula-di-indonesia-dengan-perbaikan-output-layanan-di-tingkat-pengecer", []], ["1120", "", "Prototipe sistem manufaktur berbasis WEB pada bengkel, pemesinan dengan mesin vertical machining center tunggal.", "https://digilib.itb.ac.id/gdl/view_data/prototipe-sistem-manufaktur-berbasis-web-pada-bengkel-pemesinan-dengan-mesin-vertical-machining-center-tunggal", []], ["1121", "", "Analisis kebijakan pengembangan industri kecil di Indonesia", "https://digilib.itb.ac.id/gdl/view_data/analisis-kebijakan-pengembangan-industri-kecil-di-indonesia", []], ["1122", "", "Analisis pengaruh kebijakan ekonomi makro terhadap pertumbuhan sektor pertanian.", "https://digilib.itb.ac.id/gdl/view_data/analisis-pengaruh-kebijakan-ekonomi-makro-terhadap-pertumbuhan-sektor-pertanian", []], ["1123", "", "Identifikasi faktor-faktor produksi yang secara signifikan berpengaruh pada output sektor industri farmasi di Indonesia periode tahun 1976-1997.", "https://digilib.itb.ac.id/gdl/view_data/identifikasi-faktor-faktor-produksi-yang-secara-signifikan-berpengaruh-pada-output-sektor-industri-farmasi-di-indonesia-periode-tahun-1976-1997", []], ["1124", "", "PENGEMBANGAN MODEL INDEKS POTENSI MAHASISWA SEBASAI DASAR PENGAMBILAN KEPUTUSAN PERPANJANGAN BATAS WAKTU STUDI (Studi Kasus : Mahasiswa Diploma III di STMIK LIKMI)", "https://digilib.itb.ac.id/gdl/view_data/pengembangan-model-indeks-potensi-mahasiswa-sebasai-dasar-pengambilan-keputusan-perpanjangan-batas-waktu-studi-studi-kasus-mahasiswa-diploma-iii-di-stmik-likmi", []], ["1125", "", "Pengembangan dan pengujian algoritma affected operation rescheduling", "https://digilib.itb.ac.id/gdl/view_data/pengembangan-dan-pengujian-algoritma-affected-operation-rescheduling", []], ["1126", "", "KAJIAN TERHADAP PERILAKU BELAJAR GUGUS KENDALI MUTU DITINJAU DAR1 KONSEP PERILAKU BELAJAR ORGANISASI", "https://digilib.itb.ac.id/gdl/view_data/kajian-terhadap-perilaku-belajar-gugus-kendali-mutu-ditinjau-dar1-konsep-perilaku-belajar-organisasi", []], ["1127", "", "Perbandingan algoritma simulasi paralel konservatif dan algoritma simulasi sekuensial pada sistem antrian", "https://digilib.itb.ac.id/gdl/view_data/perbandingan-algoritma-simulasi-paralel-konservatif-dan-algoritma-simulasi-sekuensial-pada-sistem-antrian-", []], ["1128", "", "Estimasi ongkos garansi sepeda motor yang dijual dengan garansi dua dimensi: studi kasus di PT.X.", "https://digilib.itb.ac.id/gdl/view_data/estimasi-ongkos-garansi-sepeda-motor-yang-dijual-dengan-garansi-dua-dimensi-studi-kasus-di-ptx", []], ["1129", "", "Analisis penerapan pajak royalti batubara di Indonesia", "https://digilib.itb.ac.id/gdl/view_data/analisis-penerapan-pajak-royalti-batubara-di-indonesia", []], ["1130", "", "Analisa dampak kebijakan fiskal terhadap keseimbangan internal ekonomi makro Indonesia.", "https://digilib.itb.ac.id/gdl/view_data/analisa-dampak-kebijakan-fiskal-terhadap-keseimbangan-internal-ekonomi-makro-indonesia", []], ["1131", "", "PENGEMBANGAN MODEL PENJADWALAN BATCH SUMBER SERENTAK UNTUK SYSTEM PRODUKSI FLOW SHOP", "https://digilib.itb.ac.id/gdl/view_data/pengembangan-model-penjadwalan-batch-sumber-serentak-untuk-system-produksi-flow-shop", []], ["1132", "", "PENGEMBANGAN SISTEM INFORMASI PERENCANAAN DAN PENGENDALIAN PRODUKSI", "https://digilib.itb.ac.id/gdl/view_data/pengembangan-sistem-informasi-perencanaan-dan-pengendalian-produksi", []]]}</script>
<script>
const D=JSON.parse(document.getElementById('D').textContent),M=D.methods,T=D.T;
const $=s=>document.getElementById(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={q:'',obj:null,kk:null,sel:null,tab:'ringkas',cmp:new Set(),view:'method',topic:''};
const KK=Object.fromEntries(D.groups.map(g=>[g.abbr,g.label]));
const objs=[...new Set(M.map(m=>m.obj))];
const OC={'Optimasi':'#ff7a59','Prediksi':'#6f9bff','Evaluasi/Simulasi':'#ffd400','Multi-Kriteria':'#3ddc97','Empiris':'#ff8fe0'};
function chips(el,arr,key,lab){$(el).innerHTML=arr.map(a=>`<button class="chip${key==='obj'?' co':''}" style="--oc:${OC[a]||'#fff'}" aria-pressed="${st[key]===a}" data-k="${key}" data-v="${esc(a)}">${esc(lab?lab(a):a)}</button>`).join('')}
function filtered(){const q=st.q.toLowerCase();return M.filter(m=>(!st.obj||m.obj===st.obj)&&(!st.kk||m.kk.includes(st.kk))&&(!q||(m.name+m.cat+m.tools.join(' ')+m.kw).toLowerCase().includes(q)))}
function side(){chips('fo',objs,'obj');chips('fk',D.groups.map(g=>g.abbr),'kk',a=>KK[a]);
const f=filtered();$('list').innerHTML=f.length?f.map(m=>`<div class="item ${st.sel===m.id&&st.view==='method'?'on':''}" style="--oc:${OC[m.obj]}" data-id="${m.id}" role="option"><input type="checkbox" data-c="${m.id}" aria-label="Pilih ${esc(m.name)} untuk dibandingkan" ${st.cmp.has(m.id)?'checked':''}><b>${esc(m.name)}<small>${esc(m.cat)}</small></b><span class="n" title="Tesis TMI yang memuat metode ini">${m.ids.length}</span></div>`).join(''):'<p class="box">Tidak ada metode yang cocok. Longgarkan filter atau ubah kata kunci.</p>';
$('sel').innerHTML=st.cmp.size?[...st.cmp].map(i=>`<button class="chip" data-r="${i}" aria-label="Hapus dari pilihan">${esc(M.find(m=>m.id===i).name.split(' (')[0])} ×</button>`).join(''):'<span class="yr">Belum ada. Centang metode di daftar.</span>';$('rst').disabled=!st.cmp.size;$('cmpn').textContent=st.cmp.size+' dipilih';$('cmpb').disabled=st.cmp.size<2}
const ul=a=>'<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
const toast=s=>{const d=document.createElement('div');d.className='toast';d.textContent=s;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)};
const copy=async t=>{try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e2){}a.remove()}
toast('Tersalin')};
window.cp=i=>copy(window._c[i]);
function prec(m){const th=m.ids.map(x=>T[x[0]].concat(x[1]));const c={};th.forEach(t=>t[4].forEach(a=>c[a]=(c[a]||0)+1));
const adv=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);
if(!th.length)return '<div class="box nov">Belum ada preseden langsung di katalog TMI. Potensi kebaruan (novelty) tinggi, tetapi pastikan juga lewat pencarian jurnal.</div>';
const rows=th.slice().sort((a,b)=>(b[5]-a[5])||(b[1]-a[1])).slice(0,60);
return `<p><b>${th.length}</b> tesis memuat kata kunci metode ini, <b>${th.filter(t=>t[5]>1).length}</b> di antaranya cocok di judul atau kata kunci resmi (paling relevan, tampil di atas). Cek manual sebelum dikutip.</p>
<div class="lbl">Pembimbing yang paling sering muncul</div><div class="chips">${adv.map(a=>`<span class="n">${esc(a[0])} · ${a[1]}</span>`).join('')}</div>
<div class="tw"><table class="hr"><tr><th>Tahun</th><th>Judul</th><th>Pembimbing</th><th>Cocok di</th></tr>${rows.map(t=>`<tr><td class="yr">${esc(t[1]||'-')}</td><td><a href="${esc(t[3])}" target="_blank" rel="noopener">${esc(t[2])}</a></td><td>${esc(t[4].join(', '))}</td><td>${['','Abstrak','Kata kunci','Judul'][t[5]]}</td></tr>`).join('')}</table></div>${th.length>60?'<p class="yr">Menampilkan 60 teratas dari '+th.length+'.</p>':''}`}
function method(){const m=M.find(x=>x.id===st.sel)||filtered()[0]||M[0];st.sel=m.id;window._c=[m.latex,m.py,'']; 
const prompt=`Kamu adalah asisten metodologi penelitian untuk mahasiswa Magister Teknik dan Manajemen Industri (TMI) ITB. Terjemahkan kerangka umum metode pemodelan menjadi rancangan konseptual yang spesifik sesuai topik penelitian pengguna. Gunakan bahasa Indonesia akademis yang ringkas, terstruktur, dan langsung pada poin teknis.\n\nMetode: ${m.name}\nAnatomi dasar: ${Object.entries(m.anat).map(e=>e[0]+': '+e[1]).join('; ')}\nTopik/masalah saya: ${st.topic||'[tulis topik penelitianmu di sini]'}\n\nBuatkan: (1) penjabaran komponen model spesifik untuk topik ini, (2) daftar data riil yang perlu dikumpulkan, dan (3) 2 poin argumen utama mengapa metode ini tepat untuk masalah tersebut.`;window._c[2]=prompt;
const T_={ringkas:`<div class="box"><b>Kapan dipakai.</b> ${esc(m.when)}</div><div class="lbl">Tools umum</div><div class="chips">${m.tools.map(t=>`<span class="n">${esc(t)}</span>`).join('')}</div><div class="lbl">Kelompok keahlian terkait</div><div class="chips">${m.kk.map(k=>`<span class="n">${esc(KK[k])}</span>`).join('')}</div>`,
anat:`<div class="tw"><table class="rh">${Object.entries(m.anat).map(e=>`<tr><th>${esc(e[0])}</th><td>${esc(e[1])}</td></tr>`).join('')}</table></div><div class="lbl">Checklist data yang harus dikumpulkan</div>${ul(m.data)}`,
asum:`<h3>Asumsi</h3>${ul(m.assum)}<h3>Batasan</h3>${ul(m.lim)}<p class="yr">Tulis ulang dengan kondisi objek penelitianmu pada bagian Asumsi dan Batasan Masalah.</p>`,
kit:`<h3>Kerangka narasi LaTeX Bab 3</h3><pre>${esc(m.latex)}</pre><button class="btn g" onclick="cp(0)">Salin LaTeX</button><h3 style="margin-top:28px">Kerangka kode</h3><pre>${esc(m.py)}</pre><button class="btn g" onclick="cp(1)">Salin kode</button>`,
prec:prec(m),
ai:`<p>Tulis topikmu, lalu salin prompt dan tempel ke Claude atau asisten AI lain. Tidak ada biaya API di halaman ini.</p><textarea id="tp" placeholder="Contoh: optimasi rute distribusi bahan baku untuk 3 pabrik dengan kendala jendela waktu">${esc(st.topic)}</textarea><div class="row"><button class="btn" onclick="st.topic=$('tp').value;method()">Perbarui prompt</button><button class="btn g" onclick="cp(2)">Salin prompt</button></div><pre>${esc(prompt)}</pre>`};
const tabs=[['ringkas','Ringkasan'],['anat','Anatomi & data'],['asum','Asumsi & batasan'],['kit','Starter kit'],['prec','Preseden TMI ('+m.ids.length+')'],['ai','Kontekstualkan']];
$('main').style.setProperty('--oc',OC[m.obj]);$('main').innerHTML=`<h2>${esc(m.name)}</h2><div class="cat">${esc(m.cat)}</div><div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab" role="tab" aria-selected="${st.tab===t[0]}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>${T_[st.tab]}`}
function compare(){const ms=[...st.cmp].map(i=>M.find(m=>m.id===i));const r=[['Jenis output','out'],['Penanganan ketidakpastian','unc'],['Skala komputasi','scale'],['Kebutuhan data','need'],['Argumen pemilihan','when'],['Batasan utama',m=>m.lim[0]],['Tools',m=>m.tools.join(', ')],['Preseden di katalog TMI',m=>m.ids.length+' tesis']];
$('main').style.setProperty('--oc','#ffd400');$('main').innerHTML=`<h2>Perbandingan metode</h2><div class="row cmphead"><span class="cat" style="margin:0">Centang 2–3 metode di daftar kiri untuk mengubah isi tabel.</span><button class="btn g" id="back">Kembali ke kartu metode</button></div><div class="tw"><table class="hr"><tr><th></th>${ms.map(m=>`<th style="background:${OC[m.obj]};color:#000">${esc(m.name)}</th>`).join('')}</tr>${r.map(x=>`<tr><th>${x[0]}</th>${ms.map(m=>`<td>${esc(typeof x[1]==='function'?x[1](m):m[x[1]])}</td>`).join('')}</tr>`).join('')}</table></div>`}
function render(){side();st.view==='cmp'&&st.cmp.size>=2?compare():(st.view='method',method())}
document.addEventListener('click',e=>{const t=e.target;
{const b=t.closest&&t.closest('[data-th]');if(b)return setTheme(b.dataset.th,true)}
if(t.dataset.k){st[t.dataset.k]=st[t.dataset.k]===t.dataset.v?null:t.dataset.v;return render()}
if(t.dataset.c){t.checked&&st.cmp.size>=3?(t.checked=false,toast('Maksimal 3 metode. Hapus salah satu dulu.')):(t.checked?st.cmp.add(t.dataset.c):st.cmp.delete(t.dataset.c));st.view='method';return side()}
if(t.dataset.t){st.tab=t.dataset.t;return method()}
if(t.dataset.r){st.cmp.delete(t.dataset.r);st.view==='cmp'&&st.cmp.size<2&&(st.view='method');return st.view==='cmp'?render():side()}
if(t.id==='rst'){st.cmp.clear();st.view='method';return render()}
if(t.id==='back'){st.view='method';return render()}
if(t.id==='cmpb'){st.view='cmp';return render()}
const it=t.closest('.item');if(it){st.sel=it.dataset.id;st.view='method';location.hash=st.sel;render()}});
$('q').addEventListener('input',e=>{st.q=e.target.value;side()});
function hash(){const h=location.hash.slice(1)||new URLSearchParams(location.search).get('method');if(h&&M.some(m=>m.id===h)){st.sel=h;st.view='method'}render()}
function setTheme(v,save){document.documentElement.dataset.theme=v;document.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.th===v)));if(save){try{localStorage.setItem('mmm-theme',v)}catch(e){}}}
let sv=null;try{sv=localStorage.getItem('mmm-theme')}catch(e){}
setTheme(sv==='dark'?'dark':'light',false);
addEventListener('hashchange',hash);hash();
</script></body></html>
