{n:'Count Dots',d:'Titik-titik muncul 1,5 detik lalu hilang. Tebak jumlahnya.',run:(b,f)=>{

 bt=btn('Kunci',()=>{bt.remove();ss.forEach((s,k)=>{s.disabled=true;const lb=s.nextSibling,w=el('div','','rw');lb.textContent=`${'RGB'[k]} · tebakanmu ${g[k]} · aslinya ${t[k]}`;s.before(w);w.append(s,el('i','','gh'));w.lastChild.style.left=`calc(15px + (100% - 30px) * ${t[k]/255})`});B.style.background=`rgb(${g})`;B.textContent='Warnamu';B.style.color='#fff';B.style.textShadow='0 0 3px #000';
  const l1=lab(...t),l2=lab(...g),dE=Math.hypot(l1[0]-l2[0],l1[1]-l2[1],l1[2]-l2[2]);f(ex(Math.max(0,dE-2),35),`ΔE ${dE.toFixed(1)}. Target rgb(${t}), tebakanmu rgb(${g})`)});b.append(bt)}},
{n:'Hold Button',d:'Tahan tombol selama waktu yang diminta, tanpa timer.',run:(b,f)=>{

 b.append(el('p',`Tahan tombol tepat <b>${N} detik</b>, lalu lepas.`),h);

{n:'Scale Area',d:'Berapa kali luas bentuk Target (oranye) dibanding luas Kontrol (biru)? Isi dengan 1 angka desimal.',run:(b,f)=>{
 const[c,x]=canvas(),A=poly(ri(4,7),40,.55),Ac=area(A),r=Math.round(rnd(.4,2.5)*10)/10;let B,k;
 do{B=poly(ri(4,7),40,.55);k=Math.sqrt(r*Ac/area(B));B=B.map(p=>[p[0]*k,p[1]*k])}while(Math.max(...B.map(p=>Math.hypot(...p)))>68);
 fp(x,A,75,150,'#74c0fc');fp(x,B,225,150,'#ff922b');x.fillStyle='#ddd';x.font='13px system-ui';x.fillText('Kontrol',50,285);x.fillText('Target',200,285);b.append(c);
 const inp=el('input');inp.type='number';inp.step='.1';inp.inputMode='decimal';inp.placeholder='Target = … × Kontrol';
 const g=btn('Kunci',()=>{const v=+inp.value;if(!(v>0))return;inp.remove();g.remove();f(ex(Math.abs(Math.log(v/r)),.3),`tebakanmu ${v}×, aslinya ${r}×`)});b.append(inp,g)}},
{n:'Center Mass',d:'Tap di mana titik pusat massa bentuk ini (anggap tebalnya merata). Boleh tap ulang sebelum dikunci.',run:(b,f)=>{
 const[c,x]=canvas(),ox=150+rnd(-12,12),oy=150+rnd(-12,12),P=poly(ri(6,9),115,.3),C=cen(P);let m=null,dn=0;
 const dr=()=>{x.clearRect(0,0,S,S);fp(x,P,ox,oy,'#a5d8ff');if(m)dot(x,m[0],m[1],'#d9480f')};dr();b.append(c);
 c.onpointerdown=e=>{if(dn)return;m=pt(c,e);dr()};
 const g=btn('Kunci',()=>{if(!m)return;dn=1;g.remove();dot(x,C[0]+ox,C[1]+oy,'#2f9e44',7);const d=Math.hypot(m[0]-C[0]-ox,m[1]-C[1]-oy);f(ex(d,22),`meleset ${Math.round(d)} px (hijau = aslinya)`)});b.append(g)}},
{n:'Expand Curve',d:'Berapa panjang kurva ini jika diluruskan? Atur garis lurus di bawah. Tanda 1× = lebar kotak, 2× = dua kali lebar kotak.',run:(b,f)=>{
 const[c,x]=canvas();let pts,L,line;
 do{pts=[...Array(ri(4,6))].map(()=>[rnd(25,275),rnd(25,275)]);const q=[pts[0],...pts,pts[pts.length-1]];line=[];
  for(let i=0;i<q.length-3;i++)for(let t=0;t<30;t++)line.push(cr(q[i],q[i+1],q[i+2],q[i+3],t/30));line.push(pts[pts.length-1]);
  L=0;for(let i=1;i<line.length;i++)L+=Math.hypot(line[i][0]-line[i-1][0],line[i][1]-line[i-1][1])}while(L<250||L>620);
 x.strokeStyle='#d9480f';x.lineWidth=3;x.lineJoin='round';x.beginPath();line.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();b.append(c);
 const rl=el('div','<i style="width:14.3%"></i><b style="left:42.86%"><span>1×</span></b><b style="left:85.71%"><span>2×</span></b>','ruler'),bar=rl.firstChild;b.append(rl);
 const s=sl(b,0,700,1,100,()=>'',v=>bar.style.width=v/7+'%'),g=btn('Kunci',()=>{const v=+s.value||1;g.remove();s.remove();f(ex(Math.abs(Math.log(v/L)),.25),`tebakanmu ${(v/300).toFixed(2)}× lebar kotak, aslinya ${(L/300).toFixed(2)}×`);bar.style.background='#2f9e44';bar.style.width=L/7+'%'});b.append(g)}},
{n:'Trace Path',d:'Bola meluncur tanpa gesekan di meja persegi, sudut datang = sudut pantul. Hanya pantulan pertama yang ditunjukkan. Tap perkiraan titik pantulan yang diminta (otomatis menempel ke dinding).',run:(b,f)=>{
 const Q=270,M=15,n=ri(3,5),[c,x]=canvas();let sx,sy,H;
 const hits=(px,py,dx,dy,k)=>{const h=[];for(let i=0;i<k;i++){const tx=dx>0?(Q-px)/dx:-px/dx,ty=dy>0?(Q-py)/dy:-py/dy,t=Math.min(tx,ty);px+=dx*t;py+=dy*t;if(tx<ty)dx=-dx;else dy=-dy;h.push([px,py])}return h};
 for(;;){sx=rnd(50,220);sy=rnd(50,220);const a=rnd(0,6.2832),dx=Math.cos(a),dy=Math.sin(a);if(Math.abs(dx)<.25||Math.abs(dx)>.95||Math.abs(dy)<.25||Math.abs(dy)>.95)continue;
  H=hits(sx,sy,dx,dy,n);if(Math.hypot(H[0][0]-sx,H[0][1]-sy)<70)continue;
  if(H.every(h=>Math.min(h[0],Q-h[0])>15||Math.min(h[1],Q-h[1])>15))break}
 let m=null,dn=0;const tgt=H[n-1];
 const dr=()=>{x.clearRect(0,0,S,S);x.save();x.translate(M,M);x.strokeStyle='#ddd';x.lineWidth=3;x.strokeRect(0,0,Q,Q);x.lineWidth=2;x.strokeStyle='#d9480f';x.beginPath();x.moveTo(sx,sy);x.lineTo(H[0][0],H[0][1]);x.stroke();dot(x,sx,sy,'#1c7ed6');dot(x,H[0][0],H[0][1],'#d9480f',4);if(m)dot(x,m[0],m[1],'#7048e8');x.restore()};
 dr();b.append(el('p',`Di mana pantulan ke-<b>${n}</b>?`),c);
 c.onpointerdown=e=>{if(dn)return;let[px,py]=pt(c,e);px=Math.min(Q,Math.max(0,px-M));py=Math.min(Q,Math.max(0,py-M));const d=[px,Q-px,py,Q-py],k=d.indexOf(Math.min(...d));
  if(k===0)px=0;else if(k===1)px=Q;else if(k===2)py=0;else py=Q;m=[px,py];dr()};
 const g=btn('Kunci',()=>{if(!m)return;dn=1;g.remove();x.save();x.translate(M,M);x.setLineDash([4,4]);x.strokeStyle='#999';x.beginPath();x.moveTo(sx,sy);H.forEach(h=>x.lineTo(h[0],h[1]));x.stroke();x.restore();
  x.save();x.translate(M,M);dot(x,tgt[0],tgt[1],'#2f9e44',8);dot(x,m[0],m[1],'#7048e8');x.restore();const d=Math.hypot(m[0]-tgt[0],m[1]-tgt[1]);f(ex(d,45),`meleset ${Math.round(d)} px (hijau = aslinya)`)});b.append(g)}}
];
