mine={};(await rpc("rp_my_scores",{p_name:me})).forEach(o=>mine[o.level_id]={size:o.code_size,cyc:+o.cycles,score:+o.score});opts();await menu()}
const GUIDE=`<p>Kodemu dijalankan sekali untuk setiap sel dengan <code>x</code> dan <code>y</code> (y positif ke atas), lalu <code>return</code> angka warna 0 sampai 16 atau konstanta seperti RED. Tanpa return atau false = kosong, true = putih. Angka di atas 16 berputar lagi (17 = WHITE).</p>
<p><b>Kondisi</b>: <code>if kondisi then ... elseif ... else ... end</code>. Gabungkan dengan <code>and</code>, <code>or</code>, <code>not</code>, dan boleh bersarang.</p>
<p><b>Variabel</b>: <code>a = 10 - x</code>. <b>Pembanding</b>: <code>==</code> sama, <code>~=</code> tidak sama, <code>&lt;</code> <code>&lt;=</code> <code>&gt;</code> <code>&gt;=</code>.</p>
<p><b>Operator</b>: <code>+ - * /</code>, <code>//</code> pembagian bulat, <code>%</code> sisa bagi, <code>^</code> pangkat. Bitwise: <code>&amp; | ~ &lt;&lt; &gt;&gt;</code>.</p>
<p><b>Fungsi</b> (tanpa prefix math.): min, max, abs, floor, round, ceil, step(a,v), sign, clamp(v,a,b), inrange(v,a,b), mix(a,b,t), sqrt, sin, cos, tan, asin, acos, atan, btoi, sort, insert, remove.</p>
<p><b>Trik hemat kode</b>: <code>return x == 0 and 5 or 15</code> menggantikan if-else. Pustaka string, io, debug, dan random tidak tersedia.</p>
<p><b>Skor</b> = code size (jumlah token) + cycles (rata-rata instruksi per sel). Makin kecil makin bagus.</p>`;
$("gh").innerHTML=GUIDE;
const XB='<span class="xb">x</span>';
const IU='<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="4.5" r="3"/><path d="M1 13c0-3.3 2.7-5 6-5s6 1.7 6 5z"/></svg>';
const IO='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2H2v12h4M10 4l4 4-4 4M14 8H6"/></svg>';
const IP='<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1v12l10-6z"/></svg>';
const IS='<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="1" y="8" width="3" height="5"/><rect x="5.5" y="4" width="3" height="9"/><rect x="10" y="1" width="3" height="12"/></svg>';
const HP=[{c:"-- berlian\nd = abs(x) + abs(y)\nreturn d <= 3 and RED",f:(x,y)=>abs(x)+abs(y)<=3?7:0},
{c:"-- plus\nif x == 0 or y == 0 then\n  return LIME end",f:(x,y)=>x==0||y==0?10:0},
{c:"-- papan catur\nreturn (x+y)%2==0\n  and PINK or WHITE",f:(x,y)=>(x+y)%2==0?5:1},
{c:"-- bingkai\nd = max(abs(x), abs(y))\nreturn d == 3 and ORANGE",f:(x,y)=>mx(abs(x),abs(y))==3?8:0}];
let hp=0,ht0=0;
const HO=(()=>{const a=[];for(let y=-3;y<=3;y++)for(let x=-3;x<=3;x++)a.push([x,y]);a.sort((p,q)=>Math.hypot(p[0],p[1])-Math.hypot(q[0],q[1])||p[1]-q[1]);return a})();
function heroLoop(now){const cv=$("hc");
if(!cv||$("menu").hidden||document.hidden){setTimeout(()=>requestAnimationFrame(heroLoop),300);return}
if(!ht0)ht0=now;const P=HP[hp],T1=P.c.length*32,T2=T1+350,T3=T2+49*14+260+1500,T4=T3+450,t=now-ht0;
$("hcode").innerHTML=hlText(P.c.slice(0,Math.min(P.c.length,Math.floor(t/32))))+(Math.floor(t/380)%2?"":"▌");
const c=cv.getContext("2d");c.clearRect(0,0,252,252);
HO.forEach(([x,y],r)=>{const px=(x+3)*36,py=(3-y)*36;c.fillStyle="#303030";c.fillRect(px,py,35,35);const col=P.f(x,y);if(!col)return;
let u=(t-T2-r*14)/260;if(u<=0)return;u=Math.min(1,u);let k=u<.7?u/.7*1.2:1.2-.2*(u-.7)/.3;if(t>T3)k*=Math.max(0,1-(t-T3)/450);
const z=35*k;c.fillStyle=COL[col-1];c.fillRect(px+17.5-z/2,py+17.5-z/2,z,z)});
if(t>T4){hp=(hp+1)%HP.length;ht0=now}
requestAnimationFrame(heroLoop)}
requestAnimationFrame(heroLoop);
function rankT(rk){return '<table><tr><th>#</th><th>Pemain</th><th>Level</th><th>'+XB+' skor</th></tr>'+(rk.slice(0,10).map((p,i)=>'<tr class="'+(p.name===me?"me":"")+'"><td>'+(i+1)+'</td><td>'+E(p.name)+'</td><td>'+p.solved+'</td><td>'+(+p.avg_score).toFixed(1)+'</td></tr>').join("")||'<tr><td colspan=4>Belum ada pemain yang menyelesaikan level.</td></tr>')+'</table>'}
async function menu(){flush();show("menu");const M=$("menu");M.innerHTML='<p class="sub">Memuat...</p>';
let rk=[];try{rk=await rpc("rp_ranking")}catch(e){}
const ks=Object.values(mine),n=ks.length,av=k=>n?(ks.reduce((s,o)=>s+o[k],0)/n).toFixed(1):"–",pos=rk.findIndex(p=>p.name===me)+1;
const PG=`<p class="lbl" style="text-transform:none"><span class="ok">${E(me)}</span>’s progress</p><div class="stats"><div>Level<br><b>${n}/${LEVELS.length}</b></div><div>${XB} size<br><b>${av("size")}</b></div><div>${XB} cycles<br><b>${av("cyc")}</b></div><div>${XB} skor<br><b>${av("score")}</b></div><div>Peringkat<br><b>${pos?"#"+pos+" / "+rk.length:"–"}</b></div></div>`;
M.innerHTML=`<div class="hero"><div><div class="wl">Welcome to</div><h1><svg class="lg" viewBox="0 0 21 20" aria-hidden="true"><rect x="6" y="0" width="9" height="9" fill="#e8365c"/><rect x="0" y="11" width="9" height="9" fill="#3d9b5a"/><rect x="12" y="11" width="9" height="9" fill="#ffcb62"/></svg>Pixelcode</h1><p class="sub">Gambar ulang pixel art dengan kode Lua seefisien mungkin. <br class="dbr">Pilih level, tulis kodenya, dan hasilnya langsung terlihat.</p><div class="hprog">${PG}</div><div class="hst"><span class="dot"></span><span>${LOCAL?"Mode lokal: data hanya di browser ini":"Terhubung ke database"}</span><button id="out" title="Keluar" aria-label="Keluar">${IO}</button></div></div><div class="ha"><pre id="hcode"></pre><canvas id="hc" width="252" height="252"></canvas></div></div>
<div class="card pcard" style="margin-bottom:14px">${PG}</div>
<div class="card" style="margin-bottom:14px"><p class="lbl">Peringkat pemain</p>${rankT(rk)}<p class="sub">Urutan: level terbanyak, lalu ${XB} skor terkecil.</p></div>
<details class="card" style="margin-bottom:14px"><summary>Panduan permainan</summary>${GUIDE}</details>
<div class="card"><p class="lbl">Pilih level</p>${LEVELS.map((l,i)=>{const m=mine[l.id];return `<div class="lv"><span>${E(l.n)}</span><span class="${m?"ok":""}">${m?"skor "+m.score:"belum"}</span><button data-p="${i}" title="Main" aria-label="Main">${IP}</button><button data-l="${i}" title="Leaderboard" aria-label="Leaderboard">${IS}</button></div>`}).join("")}</div><p class="foot">Inspired by: Replicube by Walaber</p>`}
$("menu").onclick=e=>{const d=e.target.dataset;if(d.p!==undefined)play(+d.p);else if(d.l!==undefined)lb(+d.l,"menu");else if(e.target.id==="out"){me=null;mine={};try{localStorage.removeItem("rp_me")}catch(x){}show("auth")}};
function play(i){show("game");$("who").innerHTML=IU+E(me);load(i)}
$("bk").onclick=menu;$("lb").onclick=()=>lb(cur,"game");
let lbFrom="menu";
async function lb(i,from){lbFrom=from;show("lbp");const L=LEVELS[i],P=$("lbp");P.innerHTML='<p class="sub">Memuat...</p>';
let rows=[];try{rows=(await rpc("rp_leaderboard",{p_level:L.id})).map(r=>({...r,score:+r.score}))}catch(e){P.innerHTML='<p class="er">Gagal memuat: '+E(e.message)+'</p><button id="lbk">← Kembali</button>';$("lbk").onclick=()=>show(lbFrom);return}
const m=mine[L.id],mn=rows.length?rows[0].score:0,mxv=rows.length?rows[rows.length-1].score:1,B=8,bins=Array(B).fill(0);
rows.forEach(r=>bins[mxv===mn?0:Math.min(B-1,Math.floor((r.score-mn)/(mxv-mn)*B))]++);
const bm=Math.max(1,...bins),pos=m?(mxv>mn?(m.score-mn)/(mxv-mn)*100:50/B):null;
P.innerHTML=`<h1>${E(L.n)}</h1><p class="sub">Leaderboard · ${rows.length} pemain</p><button id="lbk">← Kembali</button>
${m?"":'<p class="er" style="margin:10px 0">Kamu belum menyelesaikan level ini. Selesaikan dulu supaya namamu muncul di leaderboard.</p>'}
<div class="card" style="margin:12px 0"><p class="lbl">Sebaran skor${m?" · garis merah = skormu ("+m.score+")":""}</p><div class="hist">${bins.map(b=>'<div style="height:'+(b/bm*100)+'%"></div>').join("")}${pos==null?"":'<i style="left:'+Math.max(0,Math.min(100,pos))+'%"></i>'}</div><div class="hax"><span>${mn}</span><span>${mxv}</span></div></div>
<div class="card"><table><tr><th>#</th><th>Nama</th><th>Size</th><th>Cycles</th><th>Skor</th></tr>${rows.map((r,k)=>`<tr class="${r.name===me?"me":""}"><td>${k+1}</td><td>${E(r.name)}</td><td>${r.code_size}</td><td>${r.cycles}</td><td>${r.score}</td></tr>`).join("")||'<tr><td colspan=5>Belum ada yang menyelesaikan.</td></tr>'}</table></div>`;
$("lbk").onclick=()=>show(lbFrom)}
show("auth");
try{const n=localStorage.getItem("rp_me");if(n)login(n).catch(()=>show("auth"))}catch(e){}
</script>
</body>
</html>
