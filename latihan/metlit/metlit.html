<style>
:root{--bg:#F0EEE6;--paper:#FAF9F5;--ink:#141413;--mut:#5E5D59;--clay:#D97757;--olive:#788C5D;--sky:#6A9BCC;--line:#D9D6CA;--disp:'Newsreader',Georgia,serif;--body:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);padding:48px clamp(20px,5vw,64px) 56px;overflow-x:hidden}
.wrap{max-width:1000px;margin:0 auto}
header{position:relative;padding-right:200px}
h1{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(44px,8vw,88px);line-height:1;letter-spacing:-.025em}
.sub{margin:18px 0 0;font-size:18px;color:var(--mut);max-width:34ch}
.hero{position:absolute;right:0;top:-8px;width:170px;height:170px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:20px;margin-top:56px}
.card{position:relative;display:flex;flex-direction:column;min-height:250px;padding:28px 26px;background:var(--paper);border:1px solid var(--line);border-radius:22px;text-decoration:none;color:inherit;overflow:hidden;transition:transform .2s,border-color .2s}
.card svg{width:96px;height:96px;margin-bottom:auto}
.card h2{margin:28px 0 6px;font-family:var(--disp);font-weight:500;font-size:30px;line-height:1.1;letter-spacing:-.01em}
.card p{margin:0;color:var(--mut);font-size:15px}
.card:hover{transform:translateY(-4px);border-color:var(--ink)}
.card:nth-child(1) .fill{fill:var(--clay)}.card:nth-child(2) .fill{fill:var(--olive)}.card:nth-child(3) .fill{fill:var(--sky)}
.card:nth-child(1) .st{stroke:var(--clay)}.card:nth-child(2) .st{stroke:var(--olive)}.card:nth-child(3) .st{stroke:var(--sky)}
footer{margin-top:56px;display:flex;justify-content:flex-end}
.back{font-family:var(--disp);font-style:italic;font-size:22px;color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--clay);padding-bottom:2px}
.back:hover{color:var(--clay)}
a:focus-visible{outline:3px solid var(--clay);outline-offset:4px}
@media(max-width:700px){header{padding-right:0}.hero{position:static;width:96px;height:96px;margin-bottom:20px}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;position:relative;z-index:2}.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline;text-underline-offset:4px}.crumbs [aria-current]{opacity:.65}.crumbs{margin-bottom:28px;font-size:15px;color:var(--mut)}.crumbs a{color:var(--ink);border-bottom:1.5px solid var(--clay)}.crumbs a:hover{color:var(--clay);text-decoration:none}.crumbs span[aria-hidden]{color:var(--olive)}
</style>
</head>
<body>

</div>

</html>
