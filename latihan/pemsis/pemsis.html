<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFAF5;--pencil:#2F3237;--mut:#6B6F76;--blue:#3B6FD4;--red:#D9402F;--grid:rgba(80,130,200,.16);--disp:'Caveat',cursive;--body:'Kalam',cursive}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--pencil);font:400 17px/1.45 var(--body);padding:44px clamp(20px,5vw,64px) 52px;overflow-x:hidden;background-color:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:1000px;margin:0 auto}
svg.defs{position:absolute;width:0;height:0}
header{position:relative;padding-right:260px}
h1{margin:0;font-family:var(--disp);font-weight:700;font-size:clamp(52px,9.5vw,108px);line-height:.9;transform:rotate(-1.5deg);transform-origin:left}
.ul{display:block;width:min(100%,430px);height:18px;margin-top:2px;filter:url(#rough)}
.sub{margin:10px 0 0;font-size:18px;color:var(--mut)}
.sub::before{content:"ref: ";color:var(--blue)}
.fig{position:absolute;right:0;top:-6px;width:240px;height:150px;filter:url(#rough)}
.cap{position:absolute;right:6px;top:136px;font-family:var(--disp);font-size:20px;color:var(--red);transform:rotate(-3deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:48px 34px;margin-top:70px}
.card{position:relative;display:block;padding:30px 24px 24px;text-decoration:none;color:inherit;transition:transform .18s}
.card::before{content:"";position:absolute;inset:0;background:rgba(251,250,245,.92);border:2.5px solid var(--pencil);border-radius:6px 14px 8px 12px;filter:url(#rough);z-index:-1}
.card::after{content:"";position:absolute;inset:7px -7px -7px 7px;border:1.5px dashed var(--blue);border-radius:10px;filter:url(#rough);z-index:-2;opacity:.7}
.card{isolation:isolate}
.card h2{margin:0;font-family:var(--disp);font-weight:700;font-size:38px;line-height:1;display:inline-block;position:relative}
.card h2 svg{position:absolute;left:-8px;right:-8px;bottom:-6px;width:calc(100% + 16px);height:12px;filter:url(#rough)}
.card p{margin:14px 0 0;font-weight:700;font-size:17px;line-height:1.35}
.note{position:absolute;top:-22px;right:12px;font-family:var(--disp);font-size:22px;font-weight:500;color:var(--red);transform:rotate(5deg)}
.card:nth-child(odd){transform:rotate(-.8deg)}.card:nth-child(even){transform:rotate(.8deg)}
.card:hover{transform:rotate(0) translateY(-4px)}
.card:hover::before{background:#FFF6C9}
footer{margin-top:56px;text-align:right}
.back{font-family:var(--disp);font-weight:700;font-size:28px;color:var(--blue);text-decoration:none}
.back:hover{color:var(--red)}
a:focus-visible{outline:3px dashed var(--red);outline-offset:5px}
@media(max-width:820px){header{padding-right:0}.fig,.cap{display:none}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;position:relative;z-index:2}.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline;text-underline-offset:4px}.crumbs [aria-current]{opacity:.65}.crumbs{margin-bottom:26px;font:700 26px/1.1 var(--disp)}.crumbs a{color:var(--blue)}.crumbs a:hover{color:var(--red);text-decoration:none}.crumbs span[aria-hidden]{color:var(--red)}.crumbs [aria-current]{color:var(--pencil);opacity:1}
</style>
</head>
