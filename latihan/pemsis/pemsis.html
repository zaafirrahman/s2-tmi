:root{--bg:#F8FCF8;--ink:#111;--mut:#4B4B4B;--acc:#0B7F43;--p:#12A35B;--s:#FF5C9E;--disp:'Bricolage Grotesque',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--hw:800}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding:40px clamp(20px,5vw,64px) 48px;overflow-x:hidden;background-image:linear-gradient(rgba(18,163,91,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(18,163,91,.15) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:1000px;margin:0 auto}
svg.defs{position:absolute;width:0;height:0}
header{position:relative}
h1{margin:0;font-family:var(--disp);font-weight:var(--hw);font-size:clamp(44px,8.5vw,96px);line-height:.95;letter-spacing:-.01em}
.sub{margin:12px 0 0;font-size:18px;color:var(--mut)}
.stk{position:absolute;right:0;top:-8px;display:flex;gap:6px}
.stk svg{width:90px;height:90px}
.stk svg:nth-child(1){transform:rotate(-8deg)}.stk svg:nth-child(2){transform:rotate(6deg)}.stk svg:nth-child(3){transform:rotate(-3deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:40px 28px;margin-top:52px}
.card{position:relative;display:block;padding:20px 22px;text-decoration:none;color:inherit;background:#fff;border:3px solid #111;box-shadow:6px 6px 0 var(--p);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px 0 var(--s)}
.card h2{margin:0 0 6px;font-family:var(--disp);font-weight:var(--hw);font-size:32px;line-height:1.05}
.card p{margin:0;font-size:15px;line-height:1.4}
.card .ico{position:absolute;top:-24px;right:-12px;width:58px;height:58px;pointer-events:none}
.card.hl{background:#0B8A4A;color:#fff;box-shadow:6px 6px 0 #111}
.card.hl:hover{box-shadow:9px 9px 0 #111}
.tag{position:absolute;top:-16px;left:16px;background:#FFE14D;color:#111;border:2.5px solid #111;padding:0 10px;font:800 15px/1.5 var(--disp);transform:rotate(-3deg)}
footer{margin-top:48px;text-align:right}
.back{font-family:var(--disp);font-weight:var(--hw);font-size:22px;line-height:1.2;color:var(--acc);text-decoration:none;border-bottom:1px solid transparent}
.back:hover{border-bottom-color:var(--acc)}
a:focus-visible{outline:3px solid var(--acc);outline-offset:4px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;position:relative;z-index:2;margin-bottom:26px;font:800 18px/1.2 var(--disp)}
.crumbs a{text-decoration:none;color:var(--acc)}.crumbs a:hover{text-decoration:underline;text-underline-offset:4px}
.crumbs [aria-current]{opacity:.65}.crumbs span[aria-hidden]{color:#111}
@media(max-width:900px){.stk{display:none}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
