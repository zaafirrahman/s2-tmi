<style>
:root{--bg:#FFFCEF;--ink:#111;--mut:#4B4B4B;--yel:#FFD21F;--disp:'Bricolage Grotesque',sans-serif;--body:'IBM Plex Sans',system-ui,sans-serif;--hw:800}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);padding:40px clamp(20px,5vw,64px) 48px;overflow-x:hidden;background-image:linear-gradient(rgba(17,17,17,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(17,17,17,.07) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:1000px;margin:0 auto}
svg.defs{position:absolute;width:0;height:0}
header{position:relative}
h1{margin:0;font-family:var(--disp);font-weight:var(--hw);font-size:clamp(52px,10vw,112px);line-height:.95;letter-spacing:-.01em}
.sub{margin:14px 0 0;font-size:18px;color:var(--mut)}
.hl{display:inline;padding:0 6px;background:linear-gradient(transparent 55%,var(--yel) 55% 92%,transparent 92%)}
.stk{position:absolute;right:0;top:-8px;display:flex;gap:4px}
.stk svg{width:84px;height:84px}
.stk svg:nth-child(1){transform:rotate(-8deg)}.stk svg:nth-child(2){transform:rotate(6deg)}.stk svg:nth-child(3){transform:rotate(-3deg)}.stk svg:nth-child(4){transform:rotate(7deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:56px 36px;margin-top:64px}
.card{position:relative;display:block;background:#fff;border:3px solid #111;box-shadow:7px 7px 0 var(--p);color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--s)}
.bar{display:flex;align-items:center;justify-content:space-between;padding:5px 14px;background:var(--bar);color:#fff;border-bottom:3px solid #111;font:800 15px/1.4 var(--disp);letter-spacing:.04em}
.bar i{display:block;width:44px;height:12px;background:radial-gradient(circle at 6px 6px,#fff 4.5px,transparent 5px) 0 0/16px 12px repeat-x}
.body{padding:20px 130px 24px 22px;min-height:120px}
.card h2{margin:0 0 6px;font-family:var(--disp);font-weight:var(--hw);font-size:42px;line-height:1.02}
.card p{margin:0;font-size:16px;line-height:1.4}
.ico{position:absolute;top:-30px;right:-14px;width:78px;height:78px;display:block;pointer-events:none;transform:rotate(6deg)}
.ico2{position:absolute;right:20px;bottom:16px;width:72px;height:72px;display:block;pointer-events:none;transform:rotate(-5deg)}
footer{margin-top:56px;text-align:right}
.back{display:inline-block;padding:6px 20px;background:var(--yel);color:#111;border:3px solid #111;box-shadow:4px 4px 0 #111;font-family:var(--disp);font-weight:var(--hw);font-size:20px;line-height:1.3;text-decoration:none;transition:transform .15s,box-shadow .15s}
.back:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #111}
a:focus-visible{outline:3px solid #111;outline-offset:4px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;position:relative;z-index:2;margin-bottom:26px;font:800 18px/1.2 var(--disp)}
.crumbs a{text-decoration:none;color:#111;border-bottom:3px solid var(--yel)}.crumbs a:hover{background:var(--yel)}
.crumbs [aria-current]{opacity:.65}.crumbs span[aria-hidden]{color:#111}
@media(max-width:900px){.stk{display:none}}
@media(max-width:480px){.body{padding-right:96px}.ico2{width:56px;height:56px}.card h2{font-size:36px}}
@media(prefers-reduced-motion:reduce){.card,.back{transition:none}}
</style>
</head>
