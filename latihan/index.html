<style>
:root{--bg:#F6E9C6;--navy:#2B3A67;--navy2:#1B2650;--coral:#E8674A;--peach:#F5A98F;--sage:#7BC49A;--mustard:#F2B544;
--disp:"Fraunces",Georgia,serif;--body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--navy);font:700 16px/1.5 var(--body);padding:44px clamp(24px,5vw,64px) 56px;
background:conic-gradient(rgba(170,125,50,.09) 25%,transparent 0 50%,rgba(170,125,50,.09) 0 75%,transparent 0) 0 0/44px 44px var(--bg)}
.wrap{position:relative;max-width:1000px;margin:0 auto}
header{position:relative}
h1{margin:0;font:900 clamp(54px,9.5vw,108px)/.95 var(--disp);letter-spacing:-.02em;text-shadow:4px 4px 0 var(--peach)}
.sub{margin:16px 0 0;font-size:20px;font-weight:700;color:#4A5A8A}
.stk{position:absolute;right:0;top:-10px;display:flex;gap:2px}
.stk svg{width:96px;height:96px}
.stk svg:nth-child(odd){transform:rotate(-8deg)}.stk svg:nth-child(even){transform:rotate(7deg)}
.leaf{position:absolute;width:28px;height:28px;pointer-events:none}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:76px 30px;margin-top:92px}
.card{position:relative;display:block;min-height:128px;padding:22px 96px 22px 26px;background:var(--c);color:var(--navy);border:3px solid var(--navy);border-radius:22px;box-shadow:0 6px 0 var(--navy);text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-5px);box-shadow:0 11px 0 var(--navy)}
.card:active{transform:translateY(2px);box-shadow:0 3px 0 var(--navy)}
.card h2{margin:0 0 6px;font:900 38px/1 var(--disp);letter-spacing:-.01em}
.card p{margin:0;font-size:15px;line-height:1.4}
.kode{display:inline-block;margin-top:12px!important;padding:2px 12px;background:var(--navy);color:#FFF3D6;border-radius:8px;font-size:13px!important;font-weight:800;letter-spacing:.04em}
.char{position:absolute;right:26px;bottom:100%;width:62px;height:68px;margin-bottom:-3px}
.prop{position:absolute;right:16px;bottom:14px;width:66px;height:66px}
.card:hover .char{animation:hop .45s ease-out}
@keyframes hop{50%{transform:translateY(-9px)}}
footer{margin-top:60px;text-align:right}
.back{display:inline-block;padding:8px 24px;background:var(--navy);color:#FFF3D6;font:800 20px/1.3 var(--body);border-radius:12px;box-shadow:0 4px 0 var(--navy2);text-decoration:none;transition:transform .15s,box-shadow .15s}
.back:hover{transform:translateY(-3px);box-shadow:0 7px 0 var(--navy2)}
a:focus-visible{outline:4px solid var(--coral);outline-offset:4px}
@media(max-width:900px){.stk{display:none}main{margin-top:84px}}
@media(prefers-reduced-motion:reduce){.card,.back{transition:none}.card:hover .char{animation:none}}
</style>
</head>
