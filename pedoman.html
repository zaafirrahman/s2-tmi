<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedoman Tesis TMI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@1,400&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#cdd1d2;--panel:#e9ebeb;--ink:#1c2226;--mute:#59636a;--line:#8b959b;--acc:#f2b705;--accink:#1c2226;--paper:#fff;--bad:#b3261e;--ok:#1d6b3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202427;--panel:#2c3135;--ink:#e7e9ea;--mute:#9aa4aa;--line:#4a5258;--bad:#ff8a80;--ok:#7bd69a}}
:root[data-theme="dark"]{--bg:#202427;--panel:#2c3135;--ink:#e7e9ea;--mute:#9aa4aa;--line:#4a5258;--bad:#ff8a80;--ok:#7bd69a}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,"Helvetica Neue",Arial,sans-serif;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;background-position:-11px -11px}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,var(--acc) 0 14px,#1c2226 14px 28px)}
header{padding:20px 24px 8px;max-width:1200px;margin:0 auto}
h1{font:700 clamp(2.4rem,6vw,4rem)/.95 "Barlow Condensed",Impact,sans-serif;letter-spacing:.02em;margin:0;text-transform:uppercase}
header p{margin:6px 0 0;color:var(--mute);max-width:60ch}
.plate{display:inline-block;margin-top:10px;background:var(--acc);color:var(--accink);font:500 12px "IBM Plex Mono",monospace;padding:3px 8px;border:2px solid var(--accink)}
main{max-width:1200px;margin:0 auto;padding:12px 24px 48px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:24px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
nav.steps{grid-column:1/-1;display:flex;gap:0;flex-wrap:wrap}
nav.steps button{flex:1 1 140px;font:600 1.1rem "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;background:var(--panel);color:var(--ink);border:2px solid var(--ink);margin-right:-2px;cursor:pointer;text-align:left}
nav.steps button[aria-current="step"]{background:var(--ink);color:var(--bg)}
nav.steps small{display:block;font:400 11px "IBM Plex Mono",monospace;text-transform:none;letter-spacing:0;opacity:.8}
.bench{background:var(--panel);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:20px}
.bench h2{font:700 1.7rem "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;margin:0 0 12px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 4px}
.hint{font-weight:400;color:var(--mute);font-size:13px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;padding:8px 10px;background:var(--paper);color:#1c2226;border:2px solid var(--ink);border-radius:0}
textarea{font:13px/1.45 "IBM Plex Mono",monospace;min-height:190px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row>*{min-width:0}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;margin:10px 0}.chk input{width:18px;height:18px;accent-color:var(--ink)}
.btn{font:700 1.1rem "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:.05em;padding:10px 18px;border:2px solid var(--ink);background:var(--acc);color:var(--accink);cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sec{background:var(--panel);color:var(--ink)}
.nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px}
.bab{display:flex;gap:6px;margin:6px 0;align-items:center}.bab b{font:500 13px "IBM Plex Mono",monospace;width:54px;flex:none}
.bab button{border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;padding:6px 10px;font-weight:700}
.msg{font:13px/1.4 "IBM Plex Mono",monospace;padding:6px 10px;border-left:6px solid;margin:6px 0;background:var(--paper);color:#1c2226}
.msg.bad{border-color:var(--bad)}.msg.ok{border-color:var(--ok)}.msg.warn{border-color:var(--acc)}
aside{position:sticky;top:12px}
.tag{font:500 12px "IBM Plex Mono",monospace;color:var(--mute);margin-bottom:6px;display:flex;justify-content:space-between}
.page{aspect-ratio:210/297;background:#fff;color:#000;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);font-family:"Times New Roman",Tinos,Times,serif;display:flex;flex-direction:column;text-align:center;padding:9% 7% 9% 9%;font-size:clamp(6px,1.25vw,11px);line-height:1.15;overflow:hidden}
.page .t{font-weight:700;font-size:1.17em;text-transform:uppercase;overflow-wrap:anywhere}
.page .b{font-weight:700}.sp{flex:1}
.logo{align-self:center;width:18%;aspect-ratio:2.35/3.5;border:1px dashed #666;display:grid;place-items:center;color:#666;font-size:.8em}
code{font-family:"IBM Plex Mono",monospace;font-size:.9em}
:root{--bg:#ecebe8;--panel:#fbfaf8;--ink:#141414;--mute:#5d5d5d;--line:#b9b6af;--acc:#8c1d18;--accink:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181a;--panel:#1f2225;--ink:#ececec;--mute:#a0a4a8;--line:#3b4045;--acc:#e0645c;--accink:#16181a}}
:root[data-theme="dark"]{--bg:#16181a;--panel:#1f2225;--ink:#ececec;--mute:#a0a4a8;--line:#3b4045;--acc:#e0645c;--accink:#16181a}
body{font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif;background-image:none}
.stripe{height:5px;background:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
header{max-width:none;padding:18px 28px 6px;text-align:center}
h1{font:900 clamp(2.2rem,5vw,3.6rem)/1 "Playfair Display",Georgia,serif;text-transform:none;letter-spacing:0}
header p{margin:8px auto 0;font:italic 400 1rem "Source Serif 4",Georgia,serif}
.plate{display:block;margin-top:12px;background:none;color:var(--mute);border:0;border-top:1px solid var(--ink);border-bottom:3px double var(--ink);padding:4px 0;font:600 12px "Source Sans 3",sans-serif}
main{max-width:none;padding:14px 28px 48px}
.bench{box-shadow:none;border:1px solid var(--ink);padding:24px 28px}
.bench h2{font:700 1.7rem "Playfair Display",Georgia,serif;text-transform:none;border-bottom:1px solid var(--ink);padding-bottom:6px}
input[type=text],input[type=number],select,textarea,.bab button{border:1px solid var(--ink)}
.btn{font:600 15px "Source Sans 3",sans-serif;text-transform:none;letter-spacing:0;background:var(--acc);color:var(--accink);border:1px solid var(--acc);box-shadow:none}
.btn:active{transform:none;opacity:.85}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--ink)}
nav.steps button{font:600 15px "Source Sans 3",sans-serif;text-transform:none;letter-spacing:0;background:transparent;border:0;border-left:3px solid transparent;margin:0;padding:10px 14px}
nav.steps button[aria-current="step"]{background:var(--panel);color:var(--ink);border-left-color:var(--acc);font-weight:700}
nav.steps small{font:400 12px "Source Sans 3",sans-serif;color:var(--mute);opacity:1}
.page{box-shadow:none;border:1px solid var(--ink);position:relative;font-size:min(2vw,8.4px);max-width:440px}
.pn{position:absolute;bottom:4.5%;left:0;right:0}
.page .t{margin-bottom:.8em}.page .j{text-align:justify;line-height:1.5;margin:0 0 1em}.page .l{text-align:left}
.page .r{display:flex;text-align:left}.page .r i{flex:1;border-bottom:1px dotted #000;margin:0 2px 3px}
.pt{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.pt button{font:600 12px "Source Sans 3",sans-serif;padding:4px 8px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.pt button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media(min-width:1100px){main{grid-template-columns:230px minmax(0,1fr) 440px}nav.steps{grid-column:auto;flex-direction:column;position:sticky;top:12px;border-right:1px solid var(--ink)}nav.steps button{flex:none}}
@media(max-width:1099px){main{grid-template-columns:1fr}nav.steps{grid-column:1/-1}aside{position:static}}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;text-align:left}
header p{margin:8px 0 0}
.hr{display:flex;align-items:center;gap:14px;flex:none}
.hlogo{max-height:72px;max-width:180px;width:auto}
@media(max-width:600px){header{flex-wrap:wrap}}
header{flex-wrap:wrap;gap:12px 20px}
.plate{flex:1 0 100%;display:flex;justify-content:space-between;margin-top:0}
.btn.ic{display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:40px}
header>div:first-child{flex:1 1 0;min-width:0}
@media(max-width:600px){header>div:first-child{flex:1 1 100%}}
</style>

/* ---------- bib validator ---------- */
function bibCheck(t){const out=[],keys={};const re=/@(\w+)\s*\{\s*([^,\s]*)\s*,([\s\S]*?)(?=\n@|\s*$)/g;let m,n=0;
 while((m=re.exec(t))){n++;const [,type,key,body]=m;if(type.toLowerCase()=="comment")continue;
  if(keys[key])out.push(["bad",`Cite key ganda: ${key}`]);keys[key]=1;
  const miss=["title","year","date"].filter(f=>!new RegExp("\\b"+f+"\\s*=","i").test(body));
  if(miss.length==2&&!miss.includes("title")||miss.length==3)out.push(["warn",`${key}: field kosong (${miss.filter(x=>x!="date").join(", ")})`]);
  if(!/\b(author|editor)\s*=/i.test(body))out.push(["warn",`${key}: tidak ada author/editor`]);}
 return{n,out}}

 if(!S.nama)w.push(["bad","Nama belum diisi"]);if(!/^\d{8}$/.test(S.nim))w.push(["warn","NIM biasanya 8 digit"]);
 for(let i=0;i<S.nPemb;i++)if(!S.pemb[i])w.push(["warn",`Nama pembimbing ${i+1} kosong`]);
 const b=bibCheck(S.bib);if(!b.n)w.push(["warn","Belum ada entri referensi"]);return w.concat(b.out)}

function babTex(i){const t=S.bab[i];const K=(S.bib.match(/@\w+\s*\{\s*([^,\s]+)\s*,/)||[])[1]||"contoh2024";const body=i==0?String.raw`\section{Latar Belakang}

function readme(){return `BENGKEL TESIS — bundel tesis ITB (Magister TMI, juknis SPs Mei 2019)

Cara pakai di Overleaf:
1. Overleaf > New Project > Upload Project > pilih zip ini.
2. Menu > Compiler = pdfLaTeX. Biber dipakai otomatis untuk daftar pustaka.
3. Buka main.tex lalu Recompile. Isi bab ada di folder bab/.
4. Logo ITB sudah ada di gambar/logo-itb.png. Daftar pustaka hanya memuat entri yang disitasi di teks (\\cite).

Catatan:
- Aturan layout ada di itb-tmi.cls (margin, spasi, penomoran, daftar isi).
- Gaya sitasi sementara memakai biblatex author-year. Juknis meminta CSL ITB; belum diuji.
- Bandingkan PDF hasil kompilasi dengan template-tesis_Mei2019.docx sebelum dipakai.
`}
async function makeZip(){const z=new JSZip();z.file("main.tex",mainTex());z.file("itb-tmi.cls",CLS);
 S.bab.forEach((_,i)=>z.file(babFile(i),babTex(i)));
 z.file("referensi.bib",S.bib.trim()||`@book{contoh2024,\n  author = {Belakang, Nama},\n  title = {Judul Buku Contoh},\n  year = {2024},\n  publisher = {Penerbit}\n}\n`);
 z.folder("gambar").file("logo-itb.png",LOGO.split(",")[1],{base64:true});z.file("README.txt",readme());
 const blob=await z.generateAsync({type:"blob"});const dl=typeof claude!=="undefined"?await claude.use("downloads"):null;if(dl){await dl.save({filename:"tesis-itb-tmi.zip",data:blob});return}const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="tesis-itb-tmi.zip";document.body.appendChild(a);a.click();a.remove()}
